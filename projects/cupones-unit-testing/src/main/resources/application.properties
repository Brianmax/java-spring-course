spring.application.name=cupones-unit-testing

# Ajusta credenciales o puerto con variables de entorno si ya usas un PostgreSQL local.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/cupones}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

# Configuración didáctica para entorno local; en producción usa migraciones (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
