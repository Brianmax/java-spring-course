services:
  postgres:
    image: postgres:16-alpine
    container_name: cupones-unit-testing-postgres
    environment:
      POSTGRES_DB: cupones
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d cupones"]
      interval: 5s
      timeout: 5s
      retries: 10
