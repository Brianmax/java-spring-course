spring.application.name=pedidos-hexagonal
server.port=8080

# Perfil por defecto: arranca en memoria sin requerir PostgreSQL ni Docker.
# Para usar PostgreSQL: --spring.profiles.active=postgres
# Para cambiar la pasarela de reembolso de Stripe a Culqi: --spring.profiles.active=inmemory,culqi
spring.profiles.default=inmemory

# Regla de expiración usada por el adaptador de entrada @Scheduled
pedidos.expiracion.horas=24
pedidos.scheduler.cron=0 */30 * * * *
